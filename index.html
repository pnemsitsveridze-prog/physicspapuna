// ---------- helpers ----------
function renderMath(el) {
  if (window.renderMathInElement) {
    renderMathInElement(el, {
      delimiters: [
        { left: '$$', right: '$$', display: true },
        { left: '$', right: '$', display: false }
      ],
      throwOnError: false
    });
  } else setTimeout(() => renderMath(el), 100);
}
const uniq = a => [...new Set(a)];
const fmt = s => { const m = Math.floor(s / 60), x = s % 60; return `${String(m).padStart(2, '0')}:${String(x).padStart(2, '0')}`; };
const variantLabel = (y, v) => `${y} წელი${(TASKS.some(t => t.year === y && t.variant !== 1)) && uniq(TASKS.filter(t => t.year === y).map(t => t.variant)).length > 1 ? ' · ვარიანტი ' + v : ''}`;
const isAuto = t => t.type === 'multiple_choice';

function taskBody(t) {
  return `
  <div class="text-xs text-slate-500 mb-2">${t.year} · ვარ. ${t.variant} · №${t.number} · ${TYPE_LABEL[t.type] || t.type}</div>
  <div class="qtext text-base leading-relaxed">${esc(t.question)}</div>
  ${t.image_url ? `<img src="${esc(t.image_url)}" alt="ნახაზი" class="mt-4 max-h-80 border rounded bg-white p-1" loading="lazy">` : ''}`;
}
function optionsHtml(t, { selected, reveal, name }) {
  if (!t.options || !t.options.length) return '';
  return `<div class="mt-4 space-y-2">` + t.options.map(o => {
    let cls = 'border-slate-300 bg-white hover:bg-indigo-50';
    if (reveal && isAuto(t)) {
      if (o.key === t.correct_answer) cls = 'border-green-500 bg-green-100';
      else if (o.key === selected) cls = 'border-red-500 bg-red-100';
    } else if (o.key === selected) cls = 'border-indigo-500 bg-indigo-100';
    const clickable = isAuto(t) && !(reveal);
    return `<div ${clickable ? `data-opt="${o.key}"` : ''} class="opt flex gap-3 items-start border rounded-lg px-3 py-2 ${clickable ? 'cursor-pointer' : ''} ${cls}">
      <span class="font-bold w-6 shrink-0">${GEO[o.key] || o.key})</span><span>${esc(o.text)}</span></div>`;
  }).join('') + `</div>`;
}
function answerText(t) {
  const a = t.correct_answer || '';
  if (isAuto(t)) return `${GEO[a] || a}) `.concat('');
  return a.replace(/\b([A-G])\b/g, (m, k) => GEO[k] || k);
}

function setMode(m) {
  mode = m;
  $('#tabPractice').className = 'px-4 py-1.5 rounded-lg font-semibold ' + (m === 'practice' ? 'bg-white text-indigo-700' : 'bg-indigo-600 hover:bg-indigo-500');
  $('#tabExam').className = 'px-4 py-1.5 rounded-lg font-semibold ' + (m === 'exam' ? 'bg-white text-indigo-700' : 'bg-indigo-600 hover:bg-indigo-500');
  $('#tabPractice').textContent = 'თემატური ვარჯიში';
  $('#tabExam').textContent = 'გამოცდის სიმულაცია';
  if (examTimer) { clearInterval(examTimer); examTimer = null; }
  m === 'practice' ? practiceView() : examSetup();
}
$('#tabPractice').onclick = () => setMode('practice');
$('#tabExam').onclick = () => setMode('exam');

// ---------- PRACTICE ----------
const P = { topic: '', subtopic: '', year: '', type: '', list: [], i: 0, selected: {}, revealed: {} };
function practiceView() {
  const topics = uniq(TASKS.map(t => t.topic));
  const years = uniq(TASKS.map(t => t.year)).sort();
  const subs = uniq(TASKS.filter(t => !P.topic || t.topic === P.topic).map(t => t.subtopic)).sort();
  const sel = (id, label, opts, val) => `<label class="block text-sm"><span class="text-slate-600">${label}</span>
    <select id="${id}" class="mt-1 w-full border rounded-lg px-2 py-1.5 bg-white"><option value="">ყველა</option>
    ${opts.map(([v, l]) => `<option value="${esc(v)}" ${String(v) === String(val) ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select></label>`;
  $('#app').innerHTML = `
    <div class="bg-white rounded-xl shadow p-4 grid gap-3 md:grid-cols-4">
      ${sel('fTopic', 'თემა', topics.map(x => [x, `${x} (${TASKS.filter(t => t.topic === x).length})`]), P.topic)}
      ${sel('fSub', 'ქვეთემა', subs.map(x => [x, x]), P.subtopic)}
      ${sel('fYear', 'წელი', years.map(x => [x, x]), P.year)}
      ${sel('fType', 'ტიპი', Object.entries(TYPE_LABEL), P.type)}
    </div>
    <div id="pBody" class="mt-5"></div>`;
  $('#fTopic').onchange = e => { P.topic = e.target.value; P.subtopic = ''; applyFilter(); practiceView(); };
  $('#fSub').onchange = e => { P.subtopic = e.target.value; applyFilter(); practiceView(); };
  $('#fYear').onchange = e => { P.year = e.target.value; applyFilter(); practiceView(); };
  $('#fType').onchange = e => { P.type = e.target.value; applyFilter(); practiceView(); };
  if (!P.list.length && !P._init) { P._init = true; applyFilter(); }
  practiceTask();
}
function applyFilter() {
  P.list = TASKS.filter(t => (!P.topic || t.topic === P.topic) && (!P.subtopic || t.subtopic === P.subtopic) &&
    (!P.year || String(t.year) === P.year) && (!P.type || t.type === P.type));
  P.i = 0;
}
function practiceTask() {
  const body = $('#pBody');
  if (!P.list.length) { body.innerHTML = '<p class="text-slate-500">ამოცანა ვერ მოიძებნა.</p>'; return; }
  const t = P.list[P.i];
  const rev = !!P.revealed[t.id];
  const sel = P.selected[t.id];
  let feedback = '';
  if (rev) {
    if (isAuto(t)) {
      const ok = sel === t.correct_answer;
      feedback = `<div class="mt-4 p-3 rounded-lg ${ok ? 'bg-green-50 text-green-800' : 'bg-red-50 text-red-800'}">
        ${ok ? '✔ სწორია!' : '✘ არასწორია.'} სწორი პასუხი: <b>${GEO[t.correct_answer] || t.correct_answer})</b></div>`;
    } else {
      feedback = `<div class="mt-4 p-3 rounded-lg bg-amber-50 text-amber-900"><b>სწორი პასუხი:</b> <span class="qtext">${esc(answerText(t))}</span></div>`;
    }
  }
  body.innerHTML = `
    <div class="flex justify-between text-sm text-slate-500 mb-2"><span>${t.topic} › ${esc(t.subtopic)}</span><span>${P.i + 1} / ${P.list.length}</span></div>
    <div class="bg-white rounded-xl shadow p-5">
      ${taskBody(t)}
      ${optionsHtml(t, { selected: sel, reveal: rev })}
      ${isAuto(t) ? '' : `<button id="pShow" class="mt-4 px-4 py-2 rounded-lg bg-amber-500 text-white font-semibold">პასუხის ჩვენება</button>`}
      ${feedback}
    </div>
    <div class="flex justify-between mt-4">
      <button id="pPrev" class="px-4 py-2 rounded-lg bg-slate-200 disabled:opacity-40" ${P.i === 0 ? 'disabled' : ''}>← წინა</button>
      <button id="pNext" class="px-4 py-2 rounded-lg bg-indigo-600 text-white disabled:opacity-40" ${P.i === P.list.length - 1 ? 'disabled' : ''}>შემდეგი →</button>
    </div>`;
  body.querySelectorAll('[data-opt]').forEach(el => el.onclick = () => {
    P.selected[t.id] = el.dataset.opt; P.revealed[t.id] = true; practiceTask();
  });
  const show = $('#pShow'); if (show) show.onclick = () => { P.revealed[t.id] = true; practiceTask(); };
  $('#pPrev').onclick = () => { P.i--; practiceTask(); };
  $('#pNext').onclick = () => { P.i++; practiceTask(); };
  renderMath(body);
}

    <div class="grid gap-4 md:grid-cols-[1fr_220px]">
      <div>
        <div class="bg-white rounded-xl shadow p-5">
          ${taskBody(t)}
          ${optionsHtml(t, { selected: E.ans[t.id], reveal: false })}
          ${isAuto(t) ? '' : `<p class="mt-4 text-sm text-slate-500">ეს ამოცანა თვითშეფასებისთვისაა — პასუხი ბოლოს გამოჩნდება.</p>`}
        </div>
        <div class="flex justify-between mt-4">
          <button id="ePrev" class="px-4 py-2 rounded-lg bg-slate-200 disabled:opacity-40" ${E.i === 0 ? 'disabled' : ''}>← წინა</button>
          <button id="eNext" class="px-4 py-2 rounded-lg bg-indigo-600 text-white disabled:opacity-40" ${E.i === E.list.length - 1 ? 'disabled' : ''}>შემდეგი →</button>
        </div>
      </div>
      <div class="bg-white rounded-xl shadow p-3 h-fit"><div class="text-sm font-semibold mb-2">ნავიგაცია</div>
        <div class="grid grid-cols-6 gap-1.5">
          ${E.list.map((q, k) => `<button data-go="${k}" class="text-xs py-1.5 rounded ${k === E.i ? 'bg-indigo-600 text-white' : E.ans[q.id] ? 'bg-green-200' : 'bg-slate-200'}">${q.number}</button>`).join('')}
        </div></div>
    </div>`;
  document.querySelectorAll('[data-opt]').forEach(el => el.onclick = () => { E.ans[t.id] = el.dataset.opt; examView(); });
  document.querySelectorAll('[data-go]').forEach(el => el.onclick = () => { E.i = +el.dataset.go; examView(); });
  $('#ePrev').onclick = () => { E.i--; examView(); };
  $('#eNext').onclick = () => { E.i++; examView(); };
  $('#eFinish').onclick = () => {
    const un = E.list.filter(q => isAuto(q) && !E.ans[q.id]).length;
    if (confirm(un ? `უპასუხო ამოცანები: ${un}. დასრულდეს გამოცდა?` : 'დასრულდეს გამოცდა?')) finishExam();
  };
  renderMath($('#app'));
}
function finishExam() {
  if (examTimer) { clearInterval(examTimer); examTimer = null; }
  const auto = E.list.filter(isAuto);
  const ok = auto.filter(q => E.ans[q.id] === q.correct_answer).length;
  const skipped = auto.filter(q => !E.ans[q.id]).length;
  $('#app').innerHTML = `
    <div class="bg-white rounded-xl shadow p-6 mb-5">
      <h2 class="text-xl font-bold mb-2">შედეგები · ${E.y} · ვარიანტი ${E.v}</h2>
      <p class="text-3xl font-bold text-indigo-700">${ok} / ${auto.length}
        <span class="text-base text-slate-500 font-normal">არჩევითპასუხიანში (${auto.length ? Math.round(ok / auto.length * 100) : 0}%)</span></p>
      <p class="text-sm text-slate-600 mt-1">არასწორი: ${auto.length - ok - skipped} · გამოტოვებული: ${skipped} · დახარჯული დრო: ${fmt(Math.max(0, E.total - Math.max(0, E.left)))}</p>
      <div class="mt-3 flex gap-2"><button id="eAgain" class="px-4 py-2 rounded-lg bg-indigo-600 text-white">ახალი გამოცდა</button></div>
    </div>
    <div class="space-y-3">${E.list.map(q => {
      const a = E.ans[q.id];
      const cls = !isAuto(q) ? 'border-amber-400' : a === q.correct_answer ? 'border-green-500' : 'border-red-500';
      return `<details class="bg-white rounded-lg shadow border-l-4 ${cls} p-3">
        <summary class="cursor-pointer font-semibold">№${q.number} · ${esc(q.topic)} ·
          ${!isAuto(q) ? 'თვითშეფასება' : a ? (a === q.correct_answer ? '✔' : '✘ შენი: ' + (GEO[a] || a)) : 'გამოტოვებული'}</summary>
        <div class="mt-3">${taskBody(q)}${optionsHtml(q, { selected: a, reveal: true })}
        <div class="mt-3 p-2 rounded bg-amber-50"><b>სწორი პასუხი:</b> <span class="qtext">${isAuto(q) ? esc((GEO[q.correct_answer] || q.correct_answer) + ')') : esc(answerText(q))}</span></div></div>
      </details>`; }).join('')}</div>`;
  $('#eAgain').onclick = examSetup;
  renderMath($('#app'));
}

// ---------- boot ----------
if (Array.isArray(TASKS) && TASKS.length) {
  setMode('practice');
} else if (Array.isArray(window.TASKS) && window.TASKS.length) {
  TASKS = window.TASKS;
  setMode('practice');
} else {
  fetch('data/tasks.json').then(r => r.json()).then(d => { TASKS = d; setMode('practice'); })
    .catch(e => { $('#app').innerHTML = `<p class="text-red-600">მონაცემები ვერ ჩაიტვირთა.</p>`; });
}
</script>
</body>
</html>
